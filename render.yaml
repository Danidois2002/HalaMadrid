# Déploiement de l'API sur Render (Blueprint) : New → Blueprint → ce dépôt.
# La base de données est hébergée sur Neon : coller son URL dans DATABASE_URL lors de la création.
services:
  - type: web
    name: halamadrid-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: api
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://danidois2002.github.io
